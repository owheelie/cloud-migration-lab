# Monthly dependency updates, grouped into one PR per ecosystem to keep noise low.
# Security fixes are separate and arrive as soon as a vulnerability is published.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/services/content-api"
      - "/services/ingest-worker"
    schedule:
      interval: monthly
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      # Node type definitions must match the Lambda runtime (nodejs22.x).
      # Bump them together with the runtime, never on their own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: terraform
    directories:
      - "/bootstrap"
      - "/infra/content-api"
      - "/infra/ingest"
    schedule:
      interval: monthly
